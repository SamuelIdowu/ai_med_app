[project]
name = "ai-med-ml"
version = "1.0.0"
description = "Local Python ML Subsystem for Medical Triage & Vision"
authors = [{ name = "AI Med Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "sentence-transformers>=3.0.0",
    "peft>=0.12.0",
    "accelerate>=0.33.0",
    "pillow>=10.4.0",
    "python-multipart>=0.0.9",
    "pytest>=8.3.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
