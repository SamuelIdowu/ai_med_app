<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Medical Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e53734",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211111",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="flex size-12 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-gray-800 dark:text-gray-200">arrow_back_ios_new</span>
</div>
<h1 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center text-gray-900 dark:text-gray-100 pr-12">Medical Profile</h1>
</div>
<div class="flex flex-col gap-6 p-4">
<!-- Profile Header -->
<div class="flex w-full flex-col items-center gap-4">
<div class="relative">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-32 w-32" data-alt="A portrait of Alex Doe" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBJA9LSpd2KSkkgCREqeITv1KwHr5lafiLSeZfGHAP1FAiqSw2UIcMoAU0hk6J6tmyJ6Oynqte1ZEQpXdibIhFAI4fEf_UeYkLFREEzUX_ox4G3lfqDzwy4Z096KAg0GzhrqHUhnvkPKHEelsPnze8wUpzFymzsvCn3jwJiqr_0mWP4ibABKR538A7Lq_zH0StNQ0JZxAHxZdArKwrQaQb6f2kgxZ2OKu7dr0aYDdGLLu04kVy2Uu8pcIPNZ7rTZ3GDEhWeo0eMhI0");'></div>
<button class="absolute bottom-0 right-0 flex h-9 w-9 items-center justify-center rounded-full bg-primary text-white">
<span class="material-symbols-outlined text-lg">edit</span>
</button>
</div>
<div class="flex flex-col items-center justify-center">
<p class="text-2xl font-bold leading-tight tracking-[-0.015em] text-center text-gray-900 dark:text-gray-100">Alex Doe</p>
<p class="text-base font-normal leading-normal text-center text-gray-500 dark:text-gray-400">alex.doe@email.com</p>
</div>
</div>
<!-- Personal Information Section -->
<div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] pb-2 pt-4 text-gray-900 dark:text-gray-100">Personal Information</h2>
<div class="flex flex-col gap-4">
<label class="flex flex-col w-full">
<p class="text-base font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Full Name</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border-none bg-gray-200/50 dark:bg-gray-800/50 h-14 p-4 text-base font-normal leading-normal text-gray-900 dark:text-gray-100 placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:outline-0 focus:ring-2 focus:ring-primary/50" value="Alex Doe"/>
</label>
<div class="flex w-full gap-4">
<label class="flex flex-col flex-1">
<p class="text-base font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Date of Birth</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border-none bg-gray-200/50 dark:bg-gray-800/50 h-14 p-4 text-base font-normal leading-normal text-gray-900 dark:text-gray-100 placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:outline-0 focus:ring-2 focus:ring-primary/50" type="date" value="1990-05-15"/>
</label>
<label class="flex flex-col flex-1">
<p class="text-base font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Blood Type</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border-none bg-gray-200/50 dark:bg-gray-800/50 h-14 p-4 text-base font-normal leading-normal text-gray-900 dark:text-gray-100 placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:outline-0 focus:ring-2 focus:ring-primary/50" value="O+"/>
</label>
</div>
</div>
</div>
<!-- Allergies Section -->
<div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] pb-2 pt-4 text-gray-900 dark:text-gray-100">Allergies</h2>
<div class="flex flex-wrap gap-2 rounded-lg bg-gray-200/50 dark:bg-gray-800/50 p-4 min-h-[56px] items-center">
<div class="flex items-center gap-1 rounded-full bg-primary/20 px-3 py-1.5">
<span class="text-sm font-medium text-primary dark:text-primary-300">Peanuts</span>
<button class="text-primary dark:text-primary-300"><span class="material-symbols-outlined !text-sm">close</span></button>
</div>
<div class="flex items-center gap-1 rounded-full bg-primary/20 px-3 py-1.5">
<span class="text-sm font-medium text-primary dark:text-primary-300">Pollen</span>
<button class="text-primary dark:text-primary-300"><span class="material-symbols-outlined !text-sm">close</span></button>
</div>
<input class="form-input flex-1 bg-transparent border-none p-0 text-gray-900 dark:text-gray-100 placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:ring-0" placeholder="Add allergy..."/>
</div>
</div>
<!-- Chronic Conditions Section -->
<div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] pb-2 pt-4 text-gray-900 dark:text-gray-100">Chronic Conditions</h2>
<div class="flex flex-wrap gap-2 rounded-lg bg-gray-200/50 dark:bg-gray-800/50 p-4 min-h-[56px] items-center">
<div class="flex items-center gap-1 rounded-full bg-primary/20 px-3 py-1.5">
<span class="text-sm font-medium text-primary dark:text-primary-300">Asthma</span>
<button class="text-primary dark:text-primary-300"><span class="material-symbols-outlined !text-sm">close</span></button>
</div>
<input class="form-input flex-1 bg-transparent border-none p-0 text-gray-900 dark:text-gray-100 placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:ring-0" placeholder="Add condition..."/>
</div>
</div>
<!-- Current Medications Section -->
<div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] pb-2 pt-4 text-gray-900 dark:text-gray-100">Current Medications</h2>
<div class="flex flex-wrap gap-2 rounded-lg bg-gray-200/50 dark:bg-gray-800/50 p-4 min-h-[56px] items-center">
<div class="flex items-center gap-1 rounded-full bg-primary/20 px-3 py-1.5">
<span class="text-sm font-medium text-primary dark:text-primary-300">Albuterol Inhaler</span>
<button class="text-primary dark:text-primary-300"><span class="material-symbols-outlined !text-sm">close</span></button>
</div>
<input class="form-input flex-1 bg-transparent border-none p-0 text-gray-900 dark:text-gray-100 placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:ring-0" placeholder="Add medication..."/>
</div>
</div>
<!-- Emergency Contact Section -->
<div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] pb-2 pt-4 text-gray-900 dark:text-gray-100">Emergency Contact</h2>
<div class="flex flex-col gap-4">
<label class="flex flex-col w-full">
<p class="text-base font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Contact's Name</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border-none bg-gray-200/50 dark:bg-gray-800/50 h-14 p-4 text-base font-normal leading-normal text-gray-900 dark:text-gray-100 placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:outline-0 focus:ring-2 focus:ring-primary/50" value="Jane Doe"/>
</label>
<div class="flex w-full gap-4">
<label class="flex flex-col flex-1">
<p class="text-base font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Relationship</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border-none bg-gray-200/50 dark:bg-gray-800/50 h-14 p-4 text-base font-normal leading-normal text-gray-900 dark:text-gray-100 placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:outline-0 focus:ring-2 focus:ring-primary/50" value="Spouse"/>
</label>
<label class="flex flex-col flex-1">
<p class="text-base font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Phone Number</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border-none bg-gray-200/50 dark:bg-gray-800/50 h-14 p-4 text-base font-normal leading-normal text-gray-900 dark:text-gray-100 placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:outline-0 focus:ring-2 focus:ring-primary/50" type="tel" value="555-123-4567"/>
</label>
</div>
</div>
</div>
</div>
<!-- Action Buttons Footer -->
<div class="sticky bottom-0 mt-auto bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm p-4 pt-2 border-t border-gray-200 dark:border-gray-800">
<div class="flex flex-col gap-3">
<button class="flex w-full items-center justify-center rounded-xl bg-primary h-14 text-base font-bold text-white transition-colors hover:bg-primary/90 disabled:bg-gray-400 dark:disabled:bg-gray-600" disabled="">Save Changes</button>
<button class="text-base font-medium text-primary transition-colors hover:text-primary/80">Download My Data</button>
<button class="text-base font-medium text-red-600 dark:text-red-500 transition-colors hover:text-red-500 dark:hover:text-red-400">Delete My Data</button>
</div>
</div>
</div>
</body></html>
