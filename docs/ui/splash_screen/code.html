<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#e53734",
            "background-light": "#f8f6f6",
            "background-dark": "#211111",
          },
          fontFamily: {
            "display": ["Lexend"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative flex h-screen w-full flex-col items-center justify-center p-4 font-display group/design-root">
<div class="flex flex-col items-center justify-center gap-4">
<div class="flex h-32 w-32 items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20">
<div class="flex h-24 w-24 items-center justify-center rounded-full bg-primary/20 dark:bg-primary/30">
<span class="material-symbols-outlined text-6xl text-primary">local_hospital</span>
</div>
</div>
<div class="mt-4">
<p class="text-center text-base font-normal leading-normal text-[#1b0e0e] dark:text-background-light/80">First Aid. Fast. Offline. Reliable.</p>
</div>
</div>
</div>
</body></html>
