<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Emergency Flow: Step View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#e53734",
            "background-light": "#f8f6f6",
            "background-dark": "#211111",
          },
          fontFamily: {
            "display": ["Lexend", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Severe Bleeding</h2>
</div>
<div class="flex flex-col flex-grow px-4">
<!-- Progress Bar -->
<div class="flex flex-col gap-3 py-4">
<div class="flex gap-6 justify-between">
<p class="text-slate-700 dark:text-slate-300 text-base font-medium leading-normal">Step 1 of 5</p>
</div>
<div class="rounded-full bg-primary/20 dark:bg-primary/30">
<div class="h-2 rounded-full bg-primary" style="width: 20%;"></div>
</div>
</div>
<!-- Instruction Card -->
<div class="p-0 @container flex-grow flex items-center justify-center">
<div class="flex w-full flex-col items-stretch justify-start rounded-xl shadow-lg bg-white dark:bg-slate-800">
<div class="flex justify-center py-8">
<div class="w-32 h-32 bg-primary/10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-7xl" style="font-size: 72px;">compress</span>
</div>
</div>
<div class="flex w-full grow flex-col items-stretch justify-center gap-2 p-6 pt-0">
<p class="text-slate-900 dark:text-white text-2xl font-bold leading-tight tracking-[-0.015em] text-center">Apply Direct Pressure</p>
<div class="flex items-end gap-3 justify-between">
<p class="text-slate-600 dark:text-slate-300 text-base font-normal leading-relaxed text-center">
                1. Place a clean cloth or sterile bandage over the wound.
                <br/>
                2. Press firmly with your palm to control bleeding.
              </p>
</div>
</div>
</div>
</div>
</div>
<!-- Button Group -->
<div class="sticky bottom-0 bg-background-light dark:bg-background-dark pt-4">
<div class="flex justify-center">
<div class="flex w-full flex-1 gap-3 max-w-[480px] flex-col items-stretch px-4 pb-6">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-white text-lg font-bold leading-normal tracking-[0.015em] w-full shadow-md">
<span class="truncate">Next Step</span>
</button>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-transparent text-primary text-base font-bold leading-normal tracking-[0.015em] w-full">
<span class="truncate">Call Emergency Services</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
