<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Welcome Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#e53734",
              "background-light": "#f8f6f6",
              "background-dark": "#211111",
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="relative flex h-screen min-h-screen w-full flex-col bg-background-light dark:bg-background-dark font-display group/design-root overflow-x-hidden">
<div class="flex flex-1 flex-col justify-between p-4">
<!-- Logo Container -->
<div class="flex-grow flex items-center justify-center">
<div class="flex flex-col items-center justify-center text-center">
<div class="flex items-center justify-center rounded-xl bg-primary/10 h-20 w-20 mb-8 dark:bg-primary/20">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="health_and_safety">health_and_safety</span>
</div>
<!-- HeadlineText -->
<h1 class="text-[#1b0e0e] dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center pb-3">Your First Aid Companion</h1>
<!-- BodyText -->
<p class="text-[#1b0e0e]/80 dark:text-white/80 text-base font-normal leading-normal text-center max-w-xs">Reliable offline steps for emergencies.</p>
</div>
</div>
<!-- CTA Container -->
<div class="w-full">
<!-- SingleButton -->
<div class="flex py-3">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-primary text-[#fbf8f8] text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="truncate">Get Started</span>
</button>
</div>
<!-- MetaText -->
<p class="text-[#96504f] dark:text-[#f8f6f6]/60 text-sm font-normal leading-normal pb-3 pt-1 text-center underline">Already have an account? Sign In</p>
</div>
</div>
</div>
</body></html>
