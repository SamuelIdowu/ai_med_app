<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Photo Capture: Preview &amp; Consent</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e53734",
                        "background-light": "#fbf8f8",
                        "background-dark": "#211111",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col group/design-root overflow-hidden">
<!-- Top App Bar -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between shrink-0">
<button class="text-slate-900 dark:text-slate-100 flex size-12 items-center justify-center -ml-3">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Review Photo</h1>
<div class="flex size-12 shrink-0"></div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-4 pt-4 pb-0">
<!-- Image Preview -->
<div class="flex w-full grow flex-col">
<div class="w-full gap-1 overflow-hidden rounded-xl aspect-[3/4] flex">
<div class="w-full bg-center bg-no-repeat bg-cover aspect-auto flex-1" data-alt="Close-up photo of a scraped knee, captured for a first-aid assessment." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAgkRZVLbRcvp_XcNkvV-x5mlI97VAnR41ap8xlqZ5Z4hLAsdBeoe5BURjmxlRj73by8tY5mp6j18MDz90g7CRnUIMwS78e-6ZJGQKbvQe0NCPq7SZuqMwPRD_6cJsyd0GLOwrfEn0sK0vwdluZ4mr9WAp39v35Ez2RGFL0t-ZKdUcSAeKTPeAiTsvtsKlYyvjTvjJD5xpvrKhDvOcCfJDiBt6E_2cYnjsai1KlmRoCQRPsVvq88XC6fHdlp-cMo9pIYuQKEcVmAOs");'></div>
</div>
</div>
<!-- Consent Section -->
<div class="flex items-center gap-4 bg-background-light dark:bg-background-dark py-6 min-h-14 justify-between">
<div class="flex items-center gap-4">
<div class="text-slate-900 dark:text-slate-100 flex items-center justify-center rounded-lg bg-slate-200/80 dark:bg-slate-800 shrink-0 size-10">
<span class="material-symbols-outlined">shield_lock</span>
</div>
<p class="text-slate-800 dark:text-slate-200 text-base font-normal leading-normal flex-1">I consent to include this image in my emergency report.</p>
</div>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-slate-200 dark:bg-slate-700 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white transition-all duration-200" style="box-shadow: rgba(0, 0, 0, 0.15) 0px 3px 8px, rgba(0, 0, 0, 0.06) 0px 3px 1px;"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
</main>
<!-- Button Group -->
<footer class="flex justify-center bg-background-light dark:bg-background-dark pb-6 pt-2">
<div class="flex flex-1 gap-3 max-w-[480px] flex-col items-stretch px-4">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] w-full">
<span class="truncate">Save Photo</span>
</button>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-slate-200/80 dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-base font-bold leading-normal tracking-[0.015em] w-full">
<span class="truncate">Retake</span>
</button>
</div>
</footer>
</div>
</body></html>
