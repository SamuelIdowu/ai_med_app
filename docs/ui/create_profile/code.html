<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#e53734",
            "background-light": "#f8f6f6",
            "background-dark": "#211111",
          },
          fontFamily: {
            "display": ["Lexend", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-gray-100">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="sticky top-0 z-10 flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<div class="flex size-12 shrink-0 items-center justify-start text-gray-900 dark:text-gray-100">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center text-gray-900 dark:text-gray-100">Create Profile</h2>
<div class="flex size-12 shrink-0 items-center"></div>
</div>
<!-- Page Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-3">
<div class="h-2 w-2 rounded-full bg-primary/30"></div>
<div class="h-2 w-2 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-primary/30"></div>
<div class="h-2 w-2 rounded-full bg-primary/30"></div>
</div>
<div class="flex-grow px-4">
<!-- Body Text -->
<p class="text-gray-700 dark:text-gray-300 text-base font-normal leading-normal pb-6 pt-1 text-center">This information will help provide personalized first aid guidance.</p>
<!-- Form -->
<div class="space-y-6">
<!-- Full Name -->
<label class="flex flex-col min-w-40 flex-1">
<p class="text-base font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Full Name</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 focus:border-primary h-14 placeholder:text-gray-500 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Enter your full name" value=""/>
</label>
<!-- Age -->
<label class="flex flex-col min-w-40 flex-1">
<p class="text-base font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Age</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 focus:border-primary h-14 placeholder:text-gray-500 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Enter your age" type="number" value=""/>
</label>
<!-- Blood Type (Dropdown) -->
<label class="flex flex-col min-w-40 flex-1">
<p class="text-base font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Blood Type <span class="font-normal text-gray-500">(optional)</span></p>
<div class="relative">
<select class="form-select w-full appearance-none rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 focus:border-primary h-14 p-[15px] text-base font-normal leading-normal pr-10">
<option>Select blood type</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none">expand_more</span>
</div>
</label>
<!-- Allergies (Chips) -->
<div class="flex flex-col min-w-40 flex-1">
<p class="text-base font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Allergies</p>
<div class="flex flex-wrap items-center gap-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark p-3 min-h-[56px]">
<div class="flex items-center gap-1.5 rounded-full bg-primary/20 px-3 py-1.5 text-sm font-medium text-primary dark:text-red-300">
<span>Peanuts</span>
<span class="material-symbols-outlined text-base cursor-pointer">close</span>
</div>
<div class="flex items-center gap-1.5 rounded-full bg-primary/20 px-3 py-1.5 text-sm font-medium text-primary dark:text-red-300">
<span>Penicillin</span>
<span class="material-symbols-outlined text-base cursor-pointer">close</span>
</div>
<button class="flex items-center gap-1.5 rounded-full border border-dashed border-primary/50 px-3 py-1.5 text-sm font-medium text-primary dark:text-red-300 hover:bg-primary/10">
<span class="material-symbols-outlined text-base">add</span>
<span>Add</span>
</button>
</div>
</div>
<!-- Medications -->
<label class="flex flex-col min-w-40 flex-1">
<p class="text-base font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Medications</p>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 focus:border-primary h-24 placeholder:text-gray-500 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="e.g., Aspirin, Metformin"></textarea>
</label>
<!-- Chronic Conditions -->
<label class="flex flex-col min-w-40 flex-1">
<p class="text-base font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Chronic Conditions</p>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 focus:border-primary h-24 placeholder:text-gray-500 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="e.g., Asthma, Diabetes"></textarea>
</label>
<!-- Emergency Contact -->
<div class="rounded-lg border border-gray-300/70 dark:border-gray-700/70 p-4 space-y-4">
<p class="text-base font-semibold leading-normal text-gray-900 dark:text-gray-100">Emergency Contact</p>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-sm font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Full Name</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 focus:border-primary h-14 placeholder:text-gray-500 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Enter contact's name" value=""/>
</label>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-sm font-medium leading-normal pb-2 text-gray-800 dark:text-gray-200">Phone</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 focus:border-primary h-14 placeholder:text-gray-500 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Enter contact's phone number" type="tel" value=""/>
</label>
</div>
</div>
</div>
<!-- Bottom CTA -->
<div class="sticky bottom-0 z-10 mt-8 w-full bg-background-light dark:bg-background-dark p-4 pt-2">
<button class="flex w-full items-center justify-center rounded-xl bg-primary h-14 text-white text-lg font-bold leading-normal transition-colors hover:bg-red-700 dark:hover:bg-red-500">
        Save Profile
      </button>
</div>
</div>
</body></html>
