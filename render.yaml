# Render Blueprint Specification for Laso Cloud Infrastructure (Free Tier)
# Learn more: https://render.com/docs/blueprint-spec

version: "1"

services:
  # ---------------------------------------------------------------------------
  # 1. Laso Node.js / Express Backend (Gateway, SSE streaming, Auth, DB bridge)
  # ---------------------------------------------------------------------------
  - type: web
    name: laso-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    # GitHub Actions triggers deployment after the full CI matrix passes.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false # Set via Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set via Render dashboard
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false # Required by createAuthenticatedClient for user-scoped queries
      - key: GEMINI_API_KEY
        sync: false # Set via Render dashboard
      - key: GEOAPIFY_API_KEY
        sync: false # Optional Places fallback for nearby healthcare facilities
      - key: ALLOWED_ORIGINS
        sync: false # Comma-separated production web origins; native clients send no Origin
      - key: REDIS_URL
        sync: false # Optional; backend falls back to in-memory cache when unset
      - key: OVERPASS_API_URL
        value: https://overpass-api.de/api/interpreter
      - key: ML_SERVICE_URL
        sync: false # Hosted on Google Cloud Run (Render Free lacks RAM for PyTorch)
