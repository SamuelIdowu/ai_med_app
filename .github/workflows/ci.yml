name: Laso CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Node.js Backend Gateway Verification
  # -------------------------------------------------------------
  backend-gateway:
    name: Backend Gateway (TypeScript & Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 3000
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://your-project.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'your-supabase-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'your-supabase-service-role-key' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'your-gemini-api-key' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation
        run: npx tsc --noEmit

      - name: Run Backend Jest Test Suite (67 tests, 10 suites)
        run: npm test

  # -------------------------------------------------------------
  # Job 2: Autonomous Python ML Subsystem Verification
  # -------------------------------------------------------------
  ml-subsystem:
    name: Machine Learning Subsystem (Pytest & Safety)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ML Subsystem Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest httpx pytest-anyio

      - name: Run ML Pytest Suite & Clinical Safety Benchmark (32 tests)
        run: pytest tests -v

  # -------------------------------------------------------------
  # Job 3: Mobile Client Verification (React Native / Expo)
  # -------------------------------------------------------------
  mobile-client:
    name: Mobile Client (TypeScript & Integration Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci

      - name: Verify Mobile TypeScript Compilation (27+ Screens)
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Install Backend Dependencies for Mobile Runner
        working-directory: backend
        run: npm ci

      - name: Run Mobile Integration Test Suite (23 tests, 4 suites)
        working-directory: backend
        run: npm run test:mobile

  # -------------------------------------------------------------
  # Job 4: Production Container & Compose Validation
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Production Stack Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f docker-compose.prod.yml config
