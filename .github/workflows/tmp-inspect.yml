name: Temp VPS inspect (delete after use)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only VPS inspection
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$VPS_SSH_HOST_KEY" ]; then
            printf '%s\n' "$VPS_SSH_HOST_KEY" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Inspect containers (read-only)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          SSH="ssh -o BatchMode=yes ${VPS_USER}@${VPS_HOST}"
          $SSH "docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}'"
          echo '--- compose projects ---'
          $SSH "docker compose ls 2>/dev/null || true"
          echo '--- who publishes 80/443 ---'
          $SSH "docker ps --format '{{.Names}}' | while read n; do \
            if docker port \"\$n\" 2>/dev/null | grep -qE ':(80|443)'; then \
              echo \"== \$n ==\"; \
              docker inspect \"\$n\" --format 'Image={{.Config.Image}} Name={{.Name}}'; \
              docker inspect \"\$n\" --format '{{json .Config.Labels}}'; \
              docker inspect \"\$n\" --format '{{range .Mounts}}{{.Source}} -> {{.Destination}} ({{.Mode}}){{println}}{{end}}'; \
            fi; done"
          echo '--- the Caddyfile in use ---'
          $SSH "docker ps --format '{{.Names}}' | while read n; do \
            src=$(docker inspect \"\$n\" --format '{{range .Mounts}}{{if eq .Destination \"/etc/caddy/Caddyfile\"}}{{.Source}}{{end}}{{end}}' 2>/dev/null); \
            [ -n \"\$src\" ] && { echo \"src=\$src\"; cat \"\$src\"; }; done"
